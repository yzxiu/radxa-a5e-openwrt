# 99-disable-brnetfilter.conf — 关闭 br_netfilter 对 iptables 的桥劫持
#
# 背景: br_netfilter 使 br-lan 桥上转发的包被拉进 netfilter PREROUTING。
# sing-box TPROXY 规则在 bridge 上下文中接管 TCP 后, 包无法经策略路由
# (fwmark->table 100->lo)送回监听 socket, 被静默丢弃 —— 旁路由 TCP 全卡。
#
# 本机 br_netfilter 为 builtin(kernel-actions 定制内核), 无法 rmmod/blacklist,
# 本文件是唯一持久化禁用手段(sysctl 优先级 99, 开机即生效)。
net.bridge.bridge-nf-call-iptables = 0
net.bridge.bridge-nf-call-ip6tables = 0
net.bridge.bridge-nf-call-arptables = 0
