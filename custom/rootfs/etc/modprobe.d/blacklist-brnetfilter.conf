# blacklist-brnetfilter — 阻止 br_netfilter 模块自动加载
#
# 根因: br_netfilter 与 TPROXY 透明代理在 bridge 上下文中冲突 —— 桥转发包被
# 提前拉进 netfilter 后, tproxy verdict 接管的 TCP 包静默丢弃(旁路由 TCP 全卡)。
#
# 注: 本机 kernel-actions 定制内核(6.6.98-1-aw2607)里 br_netfilter 是 builtin,
# blacklist 对它无效; 真正的兜底在 /etc/sysctl.d/99-disable-brnetfilter.conf。
# 留着此文件防将来内核改为模块编译, 或外接模块场景。
blacklist br_netfilter
