name: Build A5E OpenWrt Image

# 触发：
#   - 手动 dispatch：可选填 deb_tag / deb_flavor / kernel_tag
#   - push 到**任意分支**且改了构建相关文件（feature 分支也能自动构建验证）
# ⚠ 但 **release 只在 main 发**：本仓的 release 就是给用户烧的成品镜像，
#   分支构建若也发 release，会被当成正式版消费（同 kernel 仓下游取“最新一条
#   非 draft release”那类问题）。分支只出 artifact。
# 流程：15 下 Debian 资产 → 20 tar 提取 u-boot/initrd → 25 拉 kernel-actions 内核
#       → 30 下 ImmortalWrt rootfs → 40 拼装 rootfs.tar → 50 guestfish 打包 img
# 打包(50)用 **nix 的 libguestfs-with-appliance**（自带 fixed appliance 内核，不碰宿主
# /boot，也不走 supermin），与 rsdk devenv 完全一致 —— apt 版 guestfish 在 Actions 会因
# azure 云核 root-only 触发 supermin `cp /boot/vmlinuz-*-azure: Permission denied`。

on:
  workflow_dispatch:
    inputs:
      deb_tag:
        description: 'radxa-build Debian release tag'
        required: false
        default: 'rsdk-t10'
      deb_flavor:
        description: 'cli / kde'
        required: false
        default: 'cli'
      kernel_tag:
        description: 'kernel-actions release (latest 或具体 v*)'
        required: false
        default: 'latest'
      rootfs_tag:
        description: 'router release (latest 或具体 ImmortalWrt-*)'
        required: false
        default: 'latest'
  push:
    branches: ['**']          # 任意分支都触发；release 另受 main 限制（见 release job 的 if）
    paths:
      - 'scripts/**'
      - 'custom/**'
      - 'patches/**'
      - 'build.sh'
      - '.github/workflows/build.yml'

permissions:
  contents: write

# 同一分支连续推送时，取消还在跑的旧构建（现在所有分支都触发，
# 不然改一行就堆一个 45 分钟的 run）。main 上也适用：新 push 本就超越旧的。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEBIAN_FRONTEND: noninteractive
  LIBGUESTFS_BACKEND: direct          # nix libguestfs 直连 qemu，不经 libvirtd

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: install host tools (非 guestfish：下载/打包/rootfs 操作用)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl ca-certificates xz-utils cpio rsync python3 tar coreutils \
            e2fsprogs util-linux parted mtools file kmod \
            qemu-user-static binfmt-support
          # 40 步要 chroot 进 aarch64 rootfs 跑 apk（wifi-scripts/iw 的 post-install
          # 必须在目标环境里执行），靠 qemu-user + binfmt_misc 做用户态模拟。
          # 这里故意不做「检查 /proc/sys/fs/binfmt_misc/qemu-aarch64 是否存在」：
          # binfmt_misc 是宿主全局机制，该文件看不到不等于跑不了（实测过这个假
          # 阴性）。真正的功能检查放在 40 步 chroot 之前（跑 /bin/uname -m）。

      - name: setup nix (提供 libguestfs-with-appliance)
        uses: DeterminateSystems/nix-installer-action@main

      # 不用 magic-nix-cache：nixpkgs 的 libguestfs-with-appliance/qemu 都有
      # cache.nixos.org 的 substitute（nix-installer 自带），直接拉即可；
      # magic-nix-cache 会把下载到的 store 路径 import 进 Actions 缓存、白白撑大。

      - name: guestfish(nix) 冒烟（自带 fixed appliance，应能直接 run）
        run: |
          nix shell nixpkgs#libguestfs-with-appliance nixpkgs#guestfs-tools nixpkgs#qemu --command bash -c 'guestfish --version && guestfish -a /dev/null run && echo "✓ nix guestfish appliance OK"'

      # ---- 15→40：下载 + 提取 + 拼装，全部纯文件操作，无 guestfish ----
      - name: 15 fetch radxa Debian assets (build-image + rootfs.tar.xz)
        env:
          DEB_TAG: ${{ inputs.deb_tag || 'rsdk-t10' }}
          DEB_FLAVOR: ${{ inputs.deb_flavor || 'cli' }}
        run: bash scripts/15-fetch-radxa-debian.sh

      - name: 20 extract kernel assets from Debian rootfs (u-boot/initrd)
        run: bash scripts/20-extract-kernel.sh

      - name: 25 fetch kernel-actions custom kernel (vmlinuz + modules + dtb)
        env:
          KERNEL_ACTIONS_TAG: ${{ inputs.kernel_tag || 'latest' }}
          # 匿名 API 共享 IP 易撞 rate limit；GITHUB_TOKEN 认证读公开仓 release，5000/h
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 必须传：匿名 GitHub API 限额 60 次/小时/**IP**，而托管 runner 共享 Azure
          # 出口 IP，别人把额度用光你就 403（run #19 实测）。带 token 后是
          # 5000 次/小时/token，且读公共仓的 release 用本仓 token 就够。
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/25-fetch-kernel.sh

      - name: 30 fetch ImmortalWrt armsr rootfs
        env:
          OWRT_TAG: ${{ inputs.rootfs_tag || 'latest' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/30-fetch-openwrt.sh

      - name: 40 assemble OpenWrt rootfs.tar
        run: bash scripts/40-assemble-rootfs.sh

      - name: 校验拼装产物（dtb / bridge / WiFi 六件套）
        # 断言必须独立于脚本内的 die：这类失败的共同特征是"不报错"，
        # 历史上已经出过一个 CI 全绿、板上 wlan 静默不在的 release（r14）。
        run: |
          set -euo pipefail
          T="../owrt/openwrt-a5e-rootfs.tar"
          [ -f "$T" ] || { echo "缺 rootfs.tar"; exit 1; }
          L=$(mktemp); tar -tf "$T" > "$L"
          chk()  { grep -qE "$1" "$L" && echo "✓ $2" || { echo "✗ 缺：$2"; exit 1; }; }
          nchk() { if grep -qE "$1" "$L"; then echo "✗ 不该有：$2"; exit 1; else echo "✓ $2"; fi; }
          chk  "sbin/parted$"                          "parted 在位（首启双槽初始化用）"
          # lubancat1 布局：dtb/kernel 已分离到 boot-files/（p2 FAT），不在 rootfs tar 里
          [ -f "../owrt/boot-files/dtb/sun55i-a527-cubie-a5e.dtb" ] \
            && echo "✓ dtb 在 boot-files/dtb/（lubancat1 布局，进 p2 FAT）" \
            || { echo "✗ 缺 boot-files/dtb/sun55i-a527-cubie-a5e.dtb（40 步未产出）"; exit 1; }
          [ -f "../owrt/boot-files/vmlinuz" ] || { echo "✗ 缺 boot-files/vmlinuz"; exit 1; }
          [ -f "../owrt/boot-files/initrd.img" ] || { echo "✗ 缺 boot-files/initrd.img"; exit 1; }
          [ -f "../owrt/boot-files/extlinux.conf" ] \
            && echo "✓ boot-files/extlinux.conf 存在（build-image 注入 root=UUID 后进 p2）" \
            || { echo "✗ 缺 boot-files/extlinux.conf"; exit 1; }
          nchk "etc/init\.d/bridge-modules" "无 bridge workaround（kernel-actions 已 builtin）"
          # ---- WiFi：缺任一项都是「镜像能启动但 wlan 静默不在」，必须在这里卡住 ----
          chk  "lib/firmware/aic8800_fw/SDIO/aic8800D80/fmacfw_8800d80_u02\.bin" "AIC8800D80 固件在位（驱动 filp_open 直读）"
          chk  "(^|/)sbin/wifi$"                          "/sbin/wifi（wifi-scripts）"
          chk  "(^|/)usr/sbin/iw$"                        "/usr/sbin/iw"
          chk  "lib/netifd/wireless/mac80211\.sh"         "netifd mac80211 handler"
          chk  "etc/capabilities/wpad\.json\.disabled"    "wpad 降权已禁用"
          nchk "etc/capabilities/wpad\.json$"             "wpad.json 未残留（否则 hostapd 注册不上 ubus）"
          chk  "etc/config/wireless$"                     "/etc/config/wireless 已预置"
          chk  "lib/apk/packages/wpad-mbedtls\.list"       "wpad 是 full 版（含 802.11ac/ax）"
          nchk "lib/apk/packages/wpad-mesh-"               "无 minimal 版 wpad 残留（那个没 ac/ax，5G 起不来）"
          # 频段要从 tar 里把文件抽出来看（tar -tf 只有文件名）—— 默认必预置 5G
          BAND=$(tar -xOf "$T" ./etc/config/wireless 2>/dev/null | grep -oE "option band '[0-9]g'" | head -1)
          [ "$BAND" = "option band '5g'" ] && echo "✓ 默认频段 5g" || { echo "✗ 默认频段不是 5g（得到：${BAND:-空}）"; exit 1; }
          # common.uc 的 find_reusable_wdev 补丁必须在：缺了它，AP+STA 同开时
          # 刚启用的 AP 会被当成"空闲件"改名成 sta0（dmesg: renamed from phy0-ap0）
          if tar -xOf "$T" ./usr/share/hostap/common.uc 2>/dev/null | grep -q "A5E-FIX-FIND-REUSABLE-WDEV"; then
            echo "✓ common.uc 已打 find_reusable_wdev 补丁"
          else
            echo "✗ common.uc 补丁缺失（AP+STA 同开时 AP 会被改名顶掉）"; exit 1
          fi
          # 不得设 option country：phy0 是 self-managed（custregd=true），country 不会生效，
          # 却会让 hostapd 进 COUNTRY_UPDATE 等 REG_CHANGE、1 秒超时后 AP-DISABLED。
          # 注意正则末尾的空格：要能区分 `option country 'CN'` 与 `option country_ie '0'`。
          if tar -xOf "$T" ./etc/config/wireless 2>/dev/null | grep -qE "^[[:space:]]*option country "; then
            echo "✗ wireless 里有 option country（self-managed phy 上会让 hostapd 卡 COUNTRY_UPDATE）"; exit 1
          else
            echo "✓ wireless 未设 option country"
          fi
          # ---- 引导配置：plymouth 必须关（串口控制台），两份文件 ----
          # lubancat1 布局：extlinux.conf 在 boot-files/（进 p2 FAT）；cmdline 在 tar 里。
          chk  "etc/kernel/cmdline$"           "/etc/kernel/cmdline 存在"
          for f in ../owrt/boot-files/extlinux.conf "tar:$T:./etc/kernel/cmdline"; do
            if [[ "$f" == tar:* ]]; then
              CNT=$(tar -xOf "$T" "${f#tar:$T:}" 2>/dev/null)
            else
              CNT=$(cat "$f" 2>/dev/null)
            fi
            if printf '%s' "$CNT" | grep -q "plymouth\.enable=0"; then
              echo "✓ ${f##*/} 含 plymouth.enable=0"
            else
              echo "✗ $f 缺 plymouth.enable=0（plymouthd 会常驻占串口）"; exit 1
            fi
          done
          # 两份必须同源（都来自 00-lib.sh 的 APPEND_PARAMS）
          norm() { printf '%s' "$1" | tr -s '[:space:]' ' ' | sed 's/^ //; s/ $//'; }
          A=$(norm "$(sed -nE 's/^[[:space:]]*append[[:space:]]+//p' ../owrt/boot-files/extlinux.conf | sed -E 's/[[:space:]]*root=[^[:space:]]*[[:space:]]*/ /g')")
          C=$(norm "$(tar -xOf "$T" ./etc/kernel/cmdline 2>/dev/null | sed -E 's/[[:space:]]*root=[^[:space:]]*[[:space:]]*/ /g')")
          if [ "$A" = "$C" ]; then
            echo "✓ boot-files extlinux append 与 /etc/kernel/cmdline 参数一致"
          else
            echo "✗ 两份引导参数不一致（有一处没跟着 APPEND_PARAMS 改）"; echo "  append : $A"; echo "  cmdline: $C"; exit 1
          fi
          rm -f "$L"

      - name: stage rootfs.tar into workspace
        run: mkdir -p dist && cp ../owrt/openwrt-a5e-rootfs.tar dist/

      - name: upload rootfs.tar (milestone artifact)
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-a5e-rootfs
          path: dist/openwrt-a5e-rootfs.tar
          retention-days: 14

      # ---- 50：guestfish 打包（nix libguestfs-with-appliance）----
      - name: 50 build image (nix guestfish)
        run: |
          # util-linux(blkid) / parted / e2fsprogs 供 build-image 脚本的 !command 用
          nix shell \
            nixpkgs#libguestfs-with-appliance \
            nixpkgs#guestfs-tools \
            nixpkgs#qemu \
            nixpkgs#util-linux \
            nixpkgs#parted \
            nixpkgs#e2fsprogs \
            nixpkgs#file \
            --command bash scripts/50-build-image.sh 2>&1 | tail -120

      - name: 校验成品镜像
        run: |
          set -euo pipefail
          IMG="../owrt-a5e.img"
          [ -f "$IMG" ] || { echo "✗ 没产出 img"; exit 1; }
          ls -lh "$IMG"; cat "../owrt-a5e.img.sha256"
          # lubancat1 布局: p1 128M boot(FAT) / p2 960M rootfs 槽A
          partx -s "$IMG" | tee /dev/stderr | awk '
            NR>1 { n[$1]=$5; }
            END {
              if (n[1] != "128M") { print "✗ p1(boot) 应 128M, 实 " n[1]; exit 1 }
              if (n[2] != "960M") { print "✗ p2(rootfs) 应 960M, 实 " n[2]; exit 1 }
              
              print "✓ 分区表 p1/p2 = 128M boot + 960M rootfs（lubancat1 布局）"
            }'
          # p2 FAT 里的启动件（mtools 免挂载读取）
          B1=$(( $(partx -g -o START --nr 1 "$IMG") * 512 ))
          mdir  -i "$IMG@@$B1" ::/ && mdir -i "$IMG@@$B1" ::/dtb/ | grep -q "sun55i-a527-cubie-a5e.dtb" && echo "✓ dtb 在 p1 /dtb/（p1 根=挂载点/boot）"
          mtype -i "$IMG@@$B1" ::/extlinux/extlinux.conf | grep -q "root=UUID=" && echo "✓ extlinux root=UUID 已注入"
          # p3 ext4 的 rootfs UUID 与 extlinux 指向一致
          S=$(partx -g -o START --nr 2 "$IMG"); N=$(partx -g -o SECTORS --nr 2 "$IMG")
          dd if="$IMG" of=/tmp/v.img bs=512 skip="$S" count="$N" status=none
          U3=$(debugfs -R "cat /etc/fstab" /tmp/v.img 2>/dev/null | awk '$2=="/"{print $1}')
          U2=$(mtype -i "$IMG@@$B1" ::/extlinux/extlinux.conf | grep -oE "root=UUID=[^ ]*")
          [ "${U3#UUID=}" = "${U2#root=UUID=}" ] && echo "✓ extlinux root= 与 p2 fstab UUID 一致（$U3）" \
            || { echo "✗ UUID 不一致: extlinux=$U2 fstab=$U3"; exit 1; }
          rm -f /tmp/v.img

      - name: stage image + tar.gz into workspace
        run: |
          mkdir -p dist
          cp ../owrt-a5e.img ../owrt-a5e.img.sha256 dist/
          cp ../owrt/build-info.env dist/          # 组件版本清单（内核/rootfs），随产物发布
          tar -C dist -czf dist/owrt-a5e.img.tar.gz owrt-a5e.img
          ls -lh dist/

      - name: upload final image
        uses: actions/upload-artifact@v4
        with:
          name: owrt-a5e-img
          path: |
            dist/owrt-a5e.img
            dist/owrt-a5e.img.tar.gz
            dist/owrt-a5e.img.sha256
            dist/build-info.env
          retention-days: 30
          if-no-files-found: error

      # 单独的压缩包 artifact：owrt-a5e-img artifact 是 zip 打包(1.1G)，
      # 只想拿 128M tar.gz 时直接下这个，免下载解压全量 zip。
      - name: upload compressed image (tar.gz 单独入口)
        uses: actions/upload-artifact@v4
        with:
          name: owrt-a5e-img-tar-gz
          path: |
            dist/owrt-a5e.img.tar.gz
            dist/owrt-a5e.img.sha256
          retention-days: 30
          if-no-files-found: error

  # build 成功即发 Release：每次成功构建 → 一条正式 release
  # （tag = rel-<UTC 日期时分秒>-r<run号>，唯一不覆盖、不依赖 v* tag 触发）
  release:
    needs: build
    # 只有 main 发 release：分支构建（含 feature 分支上的 workflow_dispatch）只留 artifact，
    # 避开了“测试分支的镜像被当成正式版烧到板子上”。
    if: needs.build.result == 'success' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: download img artifact
        uses: actions/download-artifact@v4
        with:
          name: owrt-a5e-img
          path: bundle/

      - name: publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # 组件版本清单（内核 release / rootfs 版本，25/30 步生成）
          cat bundle/build-info.env
          set -a; . ./bundle/build-info.env; set +a
          # 优先发布压缩版 img.tar.gz（标准归档、小、上传稳）+ sha256；无则回退整 img
          if [ -f bundle/owrt-a5e.img.tar.gz ]; then
            cp bundle/owrt-a5e.img.tar.gz bundle/owrt-a5e.img.sha256 bundle/build-info.env dist/
          else
            cp bundle/owrt-a5e.img bundle/owrt-a5e.img.sha256 bundle/build-info.env dist/
          fi
          ls -lh dist/
          # 所有构建都发正式 release（不带 --prerelease），tag 按 UTC 时间戳+run号唯一，
          # 不依赖人工打 v* tag 触发。
          STAMP="$(date -u +%Y%m%d-%H%M%S)"
          TAG="rel-${STAMP}-r${GITHUB_RUN_NUMBER}"
          REPONAME="${GH_REPO##*/}"
          TITLE="${REPONAME}-$(date -u +%Y%m%d-%H%M)"
          NOTES="**正式 release** from commit \`${GITHUB_SHA}\` (run #${GITHUB_RUN_NUMBER})

          ### 组件版本
          - **内核**：\`$KA_kernel_version\`（[$KERNEL_RELEASE_TAG]($KERNEL_RELEASE_URL)，built_at=$KA_built_at）
          - **rootfs**：$ROOTFS_DISTRIB（\`$ROOTFS_TAR\` @ [$ROOTFS_TAG](https://github.com/yzxiu/router/releases/tag/$ROOTFS_TAG)）
          - Debian 资产：\`$DEB_TAG\`（$DEB_FLAVOR，DSRC=$DSRC）

          完整清单见 \`build-info.env\` 附件。

          产物：owrt-a5e.img.tar.gz（标准归档、小）+ owrt-a5e.img.sha256

          烧录：
          tar -xzf owrt-a5e.img.tar.gz
          sha256sum -c owrt-a5e.img.sha256
          sudo dd if=owrt-a5e.img of=/dev/sdX bs=4M status=progress conv=fsync && sync

          内含：kernel-actions 定制内核（bridge/fw4/tproxy 已 builtin）、a5e dtb 已落到
          /usr/lib/linux-image/*/allwinner/、firewall WAN 放行、root=UUID 由 build-image 注入。"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --title "$TITLE"
            echo "updated release: $TAG"
          else
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "$TITLE" --notes "$NOTES" \
              || { echo "[warn] 直连 create 失败，改用 --draft 创建→上传→发布"; \
                   gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "$TITLE" --notes "$NOTES"; \
                   gh release upload "$TAG" dist/* --clobber; \
                   gh release edit "$TAG" --draft=false; }
            echo "created release: $TAG"
          fi
