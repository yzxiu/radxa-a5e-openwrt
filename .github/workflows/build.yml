name: Build A5E OpenWrt Image

# 触发：
#   - 手动 dispatch：可选填 deb_tag / deb_flavor / kernel_tag
#   - push 到 main 且改了构建相关文件
# 流程：15 下 Debian 资产 → 20 tar 提取 u-boot/initrd → 25 拉 kernel-actions 内核
#       → 30 下 ImmortalWrt rootfs → 40 拼装 rootfs.tar → 50 guestfish 打包 img
# 打包(50)用 **nix 的 libguestfs-with-appliance**（自带 fixed appliance 内核，不碰宿主
# /boot，也不走 supermin），与 rsdk devenv 完全一致 —— apt 版 guestfish 在 Actions 会因
# azure 云核 root-only 触发 supermin `cp /boot/vmlinuz-*-azure: Permission denied`。

on:
  workflow_dispatch:
    inputs:
      deb_tag:
        description: 'radxa-build Debian release tag'
        required: false
        default: 'rsdk-t10'
      deb_flavor:
        description: 'cli / kde'
        required: false
        default: 'cli'
      kernel_tag:
        description: 'kernel-actions release (latest 或具体 v*)'
        required: false
        default: 'latest'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'custom/**'
      - 'patches/**'
      - 'build.sh'
      - '.github/workflows/build.yml'

permissions:
  contents: write

env:
  DEBIAN_FRONTEND: noninteractive
  LIBGUESTFS_BACKEND: direct          # nix libguestfs 直连 qemu，不经 libvirtd

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: install host tools (非 guestfish：下载/打包/rootfs 操作用)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl ca-certificates xz-utils cpio rsync python3 tar coreutils \
            e2fsprogs util-linux parted

      - name: setup nix (提供 libguestfs-with-appliance)
        uses: DeterminateSystems/nix-installer-action@main

      # 不用 magic-nix-cache：nixpkgs 的 libguestfs-with-appliance/qemu 都有
      # cache.nixos.org 的 substitute（nix-installer 自带），直接拉即可；
      # magic-nix-cache 会把下载到的 store 路径 import 进 Actions 缓存、白白撑大。

      - name: guestfish(nix) 冒烟（自带 fixed appliance，应能直接 run）
        run: |
          nix shell nixpkgs#libguestfs-with-appliance nixpkgs#guestfs-tools nixpkgs#qemu --command bash -c 'guestfish --version && guestfish -a /dev/null run && echo "✓ nix guestfish appliance OK"'

      # ---- 15→40：下载 + 提取 + 拼装，全部纯文件操作，无 guestfish ----
      - name: 15 fetch radxa Debian assets (build-image + rootfs.tar.xz)
        env:
          DEB_TAG: ${{ inputs.deb_tag || 'rsdk-t10' }}
          DEB_FLAVOR: ${{ inputs.deb_flavor || 'cli' }}
        run: bash scripts/15-fetch-radxa-debian.sh

      - name: 20 extract kernel assets from Debian rootfs (u-boot/initrd)
        run: bash scripts/20-extract-kernel.sh

      - name: 25 fetch kernel-actions custom kernel (vmlinuz + modules + dtb)
        env:
          KERNEL_ACTIONS_TAG: ${{ inputs.kernel_tag || 'latest' }}
        run: bash scripts/25-fetch-kernel.sh

      - name: 30 fetch ImmortalWrt armsr rootfs
        run: bash scripts/30-fetch-openwrt.sh

      - name: 40 assemble OpenWrt rootfs.tar
        run: bash scripts/40-assemble-rootfs.sh

      - name: 校验拼装产物（dtb 落点 / bridge 无 workaround）
        run: |
          set -euo pipefail
          T="../owrt/openwrt-a5e-rootfs.tar"
          [ -f "$T" ] || { echo "缺 rootfs.tar"; exit 1; }
          tar -tf "$T" | grep -E "usr/lib/linux-image-[^/]+/allwinner/sun55i-a527-cubie-a5e\.dtb" \
            && echo "✓ a5e dtb 在 usr/lib/linux-image/allwinner/" || { echo "✗ dtb 缺"; exit 1; }
          if tar -tf "$T" | grep -q "etc/init.d/bridge-modules"; then echo "✗ 不该有 bridge workaround"; exit 1; else echo "✓ 无 bridge workaround（kernel-actions 已 builtin）"; fi

      - name: stage rootfs.tar into workspace
        run: mkdir -p dist && cp ../owrt/openwrt-a5e-rootfs.tar dist/

      - name: upload rootfs.tar (milestone artifact)
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-a5e-rootfs
          path: dist/openwrt-a5e-rootfs.tar
          retention-days: 14

      # ---- 50：guestfish 打包（nix libguestfs-with-appliance）----
      - name: 50 build image (nix guestfish)
        run: |
          # util-linux(blkid) / parted / e2fsprogs 供 build-image 脚本的 !command 用
          nix shell \
            nixpkgs#libguestfs-with-appliance \
            nixpkgs#guestfs-tools \
            nixpkgs#qemu \
            nixpkgs#util-linux \
            nixpkgs#parted \
            nixpkgs#e2fsprogs \
            nixpkgs#file \
            --command bash scripts/50-build-image.sh 2>&1 | tail -120

      - name: 校验成品镜像
        run: |
          set -euo pipefail
          IMG="../owrt-a5e.img"
          [ -f "$IMG" ] || { echo "✗ 没产出 img"; exit 1; }
          ls -lh "$IMG"; cat "../owrt-a5e.img.sha256"
          S=$(partx -g -o START --nr 3 "$IMG"); N=$(partx -g -o SECTORS --nr 3 "$IMG")
          dd if="$IMG" of=/tmp/v.img bs=512 skip="$S" count="$N" status=none
          debugfs -R "stat /usr/lib/linux-image-*/allwinner/sun55i-a527-cubie-a5e.dtb" /tmp/v.img 2>/dev/null | grep -E "Inode|Size" && echo "✓ dtb 落地"
          rm -f /tmp/v.img

      - name: stage image + tar.gz into workspace
        run: |
          mkdir -p dist
          cp ../owrt-a5e.img ../owrt-a5e.img.sha256 dist/
          tar -C dist -czf dist/owrt-a5e.img.tar.gz owrt-a5e.img
          ls -lh dist/

      - name: upload final image
        uses: actions/upload-artifact@v4
        with:
          name: owrt-a5e-img
          path: |
            dist/owrt-a5e.img
            dist/owrt-a5e.img.tar.gz
            dist/owrt-a5e.img.sha256
          retention-days: 30
          if-no-files-found: error

  # build 成功即发 Release：push/dispatch → 按时间戳生成唯一 prerelease（dev-<日期时分秒>-r<run>，
  # 每次一条不覆盖）；打 v* tag → 正式 release
  release:
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: download img artifact
        uses: actions/download-artifact@v4
        with:
          name: owrt-a5e-img
          path: bundle/

      - name: publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # 优先发布压缩版 img.tar.gz（标准归档、小、上传稳）+ sha256；无则回退整 img
          if [ -f bundle/owrt-a5e.img.tar.gz ]; then
            cp bundle/owrt-a5e.img.tar.gz bundle/owrt-a5e.img.sha256 dist/
          else
            cp bundle/owrt-a5e.img bundle/owrt-a5e.img.sha256 dist/
          fi
          ls -lh dist/
          # 正式 tag → 同名 release（重跑才覆盖）；push/dispatch → 按 UTC 日期时分秒+run号
          # 生成唯一 dev tag，每次一条独立 prerelease，不再固定 dev-build 反复覆盖。
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"; TITLE="A5E OpenWrt image $GITHUB_REF_NAME"; EXTRA=""
          else
            STAMP="$(date -u +%Y%m%d-%H%M%S)"
            TAG="dev-${STAMP}-r${GITHUB_RUN_NUMBER}"
            TITLE="A5E OpenWrt image dev-${STAMP} (run #${GITHUB_RUN_NUMBER})"
            EXTRA="--prerelease"
          fi
          NOTES="**Automated image build** from commit \`${GITHUB_SHA}\` (run #${GITHUB_RUN_NUMBER})

          烧录前先校验：sha256sum -c owrt-a5e.img.sha256
          烧录：sudo dd if=owrt-a5e.img of=/dev/sdX bs=4M status=progress conv=fsync && sync

          内含：kernel-actions 定制内核（bridge/fw4/tproxy 已 builtin）、a5e dtb 已落到
          /usr/lib/linux-image/*/allwinner/、firewall WAN 放行、root=UUID 由 build-image 注入。"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            [[ "${GITHUB_REF}" != refs/tags/* ]] && gh release edit "$TAG" --target "$GITHUB_SHA" --title "$TITLE"
            echo "updated release: $TAG"
          else
            # shellcheck disable=SC2086
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "$TITLE" $EXTRA --notes "$NOTES" \
              || { echo "[warn] 直连 create 失败，改用 --draft 创建→上传→发布"; \
                   gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "$TITLE" $EXTRA --notes "$NOTES"; \
                   gh release upload "$TAG" dist/* --clobber; \
                   gh release edit "$TAG" --draft=false; }
            echo "created release: $TAG"
          fi

      # 一次性清理旧“滚动 dev-build”机制遗留的 release（+tag）。
      # 删除成功后本步每轮仅 no-op（view 不命中），无害且防误残留。
      - name: cleanup legacy dev-build release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view dev-build >/dev/null 2>&1; then
            gh release delete dev-build --cleanup-tag --yes && echo "✓ 已删除遗留 dev-build release(+tag)"
          else
            echo "dev-build 不存在，跳过"
          fi
